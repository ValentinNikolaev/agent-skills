name: Validate skills

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-skills:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate canonical skill packages
        run: python scripts/validate_skills.py

      - name: Run regression and helper smoke tests
        run: python -m unittest discover -s tests -v

      - name: Verify generated distributions
        run: python scripts/generate_skill_wrappers.py --check --clean --strict-links
